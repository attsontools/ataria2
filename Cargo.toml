[package]
name = "ataria2-service"
version = "0.1.0-alpha.0"
edition = "2021"

[lib]
name = "ataria2_service"
path = "src/lib.rs"

[dependencies]
dirs = "6"
fs2 = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

